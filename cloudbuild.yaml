# Runs on every push (git-push-react-autoql), so develop and every PR get a pass/fail build check. Nothing is
# deployed from here: releases are published to npm by hand.
steps:
  - name: 'node:22-alpine'
    id: Build
    entrypoint: sh
    args:
      - '-ec'
      - |
        node --version && npm --version
        # npm ci builds the package through "prepare" (rimraf dist, then rollup), so this installs and builds once.
        npm ci --legacy-peer-deps
        ls dist
    env:
      # rollup peaks at about 1.3 GB, right at Node's default heap limit. The build machine has 8 GB.
      - 'NODE_OPTIONS=--max-old-space-size=4096'

options:
  substitution_option: 'ALLOW_LOOSE'

timeout: 3600s

tags:
  ['$REPO_NAME', '$COMMIT_SHA', '$SHORT_SHA', '$PROJECT_ID', '$BRANCH_NAME', '$TAG_NAME', '$REVISION_ID', '$BUILD_ID']
